[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 2
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"
