	<rect id="proc" data-box="" class="panel" x="476" y="16" width="468" height="268" rx="14"/>
	<text data-for="proc" class="ui muted" x="492" y="44" font-size="11" font-weight="700" letter-spacing="1">MAILSLOTD, OR YOUR OWN PROCESS</text>
	<rect id="daemon" data-box="" class="card" x="492" y="100" width="200" height="128" rx="10"/>
	<text data-for="daemon" class="ui ink" x="508" y="126" font-size="13" font-weight="700">Daemon</text>
	<text data-for="daemon" class="ui muted" x="508" y="146" font-size="11">JSON-RPC 2.0,</text>
	<text data-for="daemon" class="ui muted" x="508" y="162" font-size="11">one object per line</text>
	<text data-for="daemon" class="ui muted" x="508" y="186" font-size="11">subscribe: forwards</text>
	<text data-for="daemon" class="ui muted" x="508" y="202" font-size="11">every engine event</text>
	<rect id="engine" data-box="" x="744" y="100" width="184" height="128" rx="10" fill="url(#red)"/>
