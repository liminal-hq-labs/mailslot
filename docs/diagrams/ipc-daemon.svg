	<text data-for="engine" class="mono white" x="760" y="146" font-size="11">mailslot-core</text>
	<text data-for="engine" class="ui white" x="760" y="170" font-size="11">start, stop, pause,</text>
	<text data-for="engine" class="ui white" x="760" y="186" font-size="11">rotate_token, send</text>
	<text data-for="engine" class="mono white" x="760" y="206" font-size="11">subscribe()</text>
	<text data-for="proc" class="ui muted" x="492" y="262" font-size="11">One engine; the GTK app and mailslot-cli link it directly.</text>

