	<text data-for="socket" class="ui muted" x="290" y="166" font-size="11">folder 0700,</text>
	<text data-for="socket" class="ui muted" x="290" y="182" font-size="11">socket 0600</text>
	<text data-for="socket" class="ui muted" x="290" y="202" font-size="11">never TCP</text>
	<text class="mono muted" x="276" y="250" font-size="11">$XDG_RUNTIME_DIR/</text>
	<text class="mono muted" x="276" y="266" font-size="11">ca.liminalhq.mailslot/</text>

