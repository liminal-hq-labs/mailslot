	<text data-for="life" class="ui muted" x="696" y="420" font-size="11" font-weight="700" letter-spacing="1">LIFECYCLE</text>
	<text data-for="life" class="ui ink" x="696" y="442" font-size="11">Exits on SIGTERM, SIGINT</text>
	<text data-for="life" class="ui ink" x="696" y="458" font-size="11">or the shutdown method,</text>
