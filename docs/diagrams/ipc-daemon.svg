<?xml version="1.0" encoding="UTF-8"?>
<!--
	Mailslot architecture diagram: how mailslot-ipc exposes the engine to clients in any language over a Unix socket.
	Light by default, dark through prefers-color-scheme, a complete still frame under prefers-reduced-motion.

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-loop="10">
	<title id="title">Mailslot IPC daemon</title>
	<desc id="desc">Clients in any language (a Python script, a Qt or C++ app, or Rust through mailslot_ipc::Client) connect to the Unix socket mailslotd.sock under $XDG_RUNTIME_DIR, whose folder is mode 0700 and socket 0600 and which is never TCP. They speak newline-delimited JSON-RPC 2.0 to the Daemon, which runs in mailslotd or embedded in your own process and calls the Engine. After subscribe, the daemon forwards every engine event as an event notification. Animated: the client subscribes, calls start, receives a StateChanged event and the reply with the new state, then an Upload Finished event. Engine errors use code -32000. mailslotd exits on SIGTERM, SIGINT or the shutdown method, removing its socket and any router mapping, and runs as the systemd user unit mailslotd.service.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, sans-serif; }
		.mono { font-family: ui-monospace, monospace; }
		.bg-a { stop-color: #ffffff; }
		.bg-b { stop-color: #eaf0fa; }
		.ink { fill: #161c2d; }
		.muted { fill: #4b566e; }
		.red-ink { fill: #b81d32; }
		.white { fill: #ffffff; }
		.panel { fill: #f5f7fc; stroke: #d3dbea; }
		.card { fill: #ffffff; stroke: #c3cce0; }
		.engine { fill: #fdf0f2; stroke: #eaa6af; }
		.wire { fill: none; stroke: #7d89a3; stroke-width: 1.6; }
		.soft { stroke-dasharray: 4 4; }
		.arrow { fill: #7d89a3; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #0d1220; }
			.bg-b { stop-color: #161d33; }
			.ink { fill: #f4f6fb; }
			.muted { fill: #b8c2d8; }
			.red-ink { fill: #ff8a96; }
			.panel { fill: #131a2c; stroke: #2a3452; }
			.card { fill: #1c243a; stroke: #36425f; }
			.engine { fill: #2a1622; stroke: #7a2e3c; }
			.wire { stroke: #8b97b1; }
			.arrow { fill: #8b97b1; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#d6334a"/>
			<stop offset="1" stop-color="#a8172c"/>
		</linearGradient>
		<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2a6fe0"/>
			<stop offset="1" stop-color="#1a52b8"/>
		</linearGradient>
		<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
			<path class="arrow" d="M0 1 L10 5 L0 9 z"/>
		</marker>
		<path id="p-c" d="M220 92 C 250 92, 250 140, 274 140"/>
		<path id="p-sd" d="M436 148 H 490"/>
		<path id="p-ds" d="M490 180 H 438"/>
		<path id="p-de" d="M692 148 H 742"/>
		<path id="p-ed" d="M742 180 H 694"/>
	</defs>

