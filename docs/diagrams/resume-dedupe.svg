-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" data-loop="12">
	<title id="title">Mailslot resume and dedupe</title>
	<desc id="desc">A sequence between the client (Client::send_file) and the server. The client hashes the file with SHA-256 and asks GET /&lt;token&gt;/have?sha256=…; the server answers {"have":false} (with true the client skips the upload and reports SendEvent::Skipped). The upload id is the first 16 bytes of SHA-256 of "sha:name" in hex, so a restarted process resumes too. HEAD /&lt;token&gt;/&lt;name&gt; with X-Mailslot-Upload-Id returns 200 with X-Mailslot-Offset: 0. The PUT streams until the connection drops; because an upload id was given the server keeps the .part file. The client waits with backoff, asks HEAD again and gets X-Mailslot-Offset: 4194304, then sends PUT with Content-Range: bytes 4194304-9437183/9437184. The server hashes the part it already holds, appends, and answers 201 Created with X-Mailslot-Sha256, which the client compares with its own hash. A Content-Range start that does not match the server's offset gets 409 with the current offset, and the client realigns. Animated: the messages appear in order down the lifelines, with the break and the retry.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, sans-serif; }
		.mono { font-family: ui-monospace, monospace; }
		.bg-a { stop-color: #ffffff; }
		.bg-b { stop-color: #eaf0fa; }
		.ink { fill: #161c2d; }
		.muted { fill: #4b566e; }
		.red-ink { fill: #b81d32; }
		.green-ink { fill: #1d6b31; }
		.white { fill: #ffffff; }
		.panel { fill: #f5f7fc; stroke: #d3dbea; }
		.card { fill: #ffffff; stroke: #c3cce0; }
		.reject { fill: #fdf0f2; stroke: #eaa6af; }
		.good { fill: #edf8f0; stroke: #9fd3ad; }
		.wire { fill: none; stroke: #7d89a3; stroke-width: 1.6; }
		.soft { stroke-dasharray: 4 4; }
		.life { fill: none; stroke: #aab4c8; stroke-width: 1.4; stroke-dasharray: 2 5; }
		.cut { fill: none; stroke: #b81d32; stroke-width: 2; stroke-linecap: round; }
		.arrow { fill: #7d89a3; }
		.track { fill: #dce3f0; }
		.hi { fill: none; stroke: #2f7bea; stroke-width: 2.4; }
		.ok { fill: none; stroke: #23883a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #0d1220; }
			.bg-b { stop-color: #161d33; }
			.ink { fill: #f4f6fb; }
			.muted { fill: #b8c2d8; }
			.red-ink { fill: #ff8a96; }
			.green-ink { fill: #7ee39a; }
			.panel { fill: #131a2c; stroke: #2a3452; }
			.card { fill: #1c243a; stroke: #36425f; }
			.reject { fill: #2a1622; stroke: #7a2e3c; }
			.good { fill: #12281a; stroke: #2f6b40; }
			.wire { stroke: #8b97b1; }
			.life { stroke: #4a5675; }
			.cut { stroke: #ff8a96; }
			.arrow { fill: #8b97b1; }
			.track { fill: #2b3555; }
			.hi { stroke: #6ea8ff; }
			.ok { stroke: #4ad06a; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#d6334a"/>
			<stop offset="1" stop-color="#a8172c"/>
		</linearGradient>
		<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2a6fe0"/>
			<stop offset="1" stop-color="#1a52b8"/>
		</linearGradient>
		<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
			<path class="arrow" d="M0 1 L10 5 L0 9 z"/>
		</marker>
	</defs>

	<rect data-bg="" width="960" height="640" rx="16" fill="url(#bg)"/>

	<!-- Lifelines -->
	<rect id="h-client" data-box="" class="card" x="140" y="16" width="200" height="52" rx="12"/>
	<text data-for="h-client" class="ui ink" x="156" y="38" font-size="13" font-weight="700">Client</text>
	<text data-for="h-client" class="mono muted" x="156" y="56" font-size="11">Client::send_file</text>
	<rect id="h-server" data-box="" x="620" y="16" width="200" height="52" rx="12" fill="url(#blue)"/>
	<text data-for="h-server" class="ui white" x="636" y="38" font-size="13" font-weight="700">Server</text>
	<text data-for="h-server" class="mono white" x="636" y="56" font-size="11">/&lt;token&gt;/photo.jpg</text>
	<path data-line="" class="life" d="M240 70 V 624"/>
	<path data-line="" class="life" d="M720 70 V 624"/>

	<!-- Side paths -->
	<rect id="side0" data-box="" class="panel" x="24" y="124" width="200" height="48" rx="8"/>
	<text data-for="side0" class="ui muted" x="36" y="144" font-size="11">have: true → skip,</text>
	<text data-for="side0" class="ui muted" x="36" y="160" font-size="11">SendEvent::Skipped</text>
	<rect id="side1" data-box="" class="panel" x="736" y="400" width="200" height="64" rx="8"/>
	<text data-for="side1" class="ui muted" x="748" y="420" font-size="11">wrong start: 409 with</text>
	<text data-for="side1" class="ui muted" x="748" y="436" font-size="11">the current offset,</text>
	<text data-for="side1" class="ui muted" x="748" y="452" font-size="11">client realigns</text>

