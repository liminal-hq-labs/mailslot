<?xml version="1.0" encoding="UTF-8"?>
<!--
	Mailslot architecture diagram: the resume and dedupe handshakes between Client::send_file and the server.
	Light by default, dark through prefers-color-scheme, a complete still frame under prefers-reduced-motion.

