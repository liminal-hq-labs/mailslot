<?xml version="1.0" encoding="UTF-8"?>
<!--
	Mailslot architecture diagram: the threading model of the GTK app, the GLib main thread and the tokio runtime.
	Light by default, dark through prefers-color-scheme, a complete still frame under prefers-reduced-motion.

