<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mailslot hero banner: a file travels through a slot into the app window.
  Light by default, dark through prefers-color-scheme, still under prefers-reduced-motion.
  The wordmark is outlined from Adwaita Sans (SIL OFL) and sits between the hero-text markers.

  (c) Copyright 2026 Liminal HQ, Scott Morris
  SPDX-License-Identifier: Apache-2.0 OR MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc">
	<title id="hero-title">Mailslot</title>
	<desc id="hero-desc">Mailslot, a private drop slot for files. An animated banner shows a file leaving a terminal, slipping through a letter slot and arriving in the app window as an upload with a verified checksum.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Adwaita Sans", Inter, sans-serif; }
		.mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
		.bg-a { stop-color: #ffffff; }
		.bg-b { stop-color: #e9effa; }
		.ink { fill: #161c2d; }
		.muted { fill: #4b566e; }
		.dim { fill: #7a859c; }
		.surface { fill: #ffffff; stroke: #cbd3e3; }
		.surface-2 { fill: #f1f4fa; }
		.inset { fill: none; stroke: #e1e6f0; }
		.track { fill: #dce3f0; }
		.chip { fill: #ffffff; stroke: #cbd3e3; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #0d1220; }
			.bg-b { stop-color: #161d33; }
			.ink { fill: #f4f6fb; }
			.muted { fill: #b8c2d8; }
			.dim { fill: #8793ad; }
			.surface { fill: #1a2136; stroke: #2e3957; }
			.surface-2 { fill: #232b44; }
			.inset { stroke: #2a3350; }
			.track { fill: #2b3555; }
			.chip { fill: #1a2136; stroke: #2e3957; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f0505f"/>
			<stop offset="1" stop-color="#bb182c"/>
		</linearGradient>
		<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4c9af5"/>
			<stop offset="1" stop-color="#1f62d0"/>
		</linearGradient>
		<filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b2b55" flood-opacity="0.2"/>
		</filter>
		<filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
			<feGaussianBlur stdDeviation="4" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
		<clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
		<clipPath id="typed"><rect x="438" y="150" width="0" height="16"><animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0222;0.1333;0.93;1" values="0;0;166;166;0"/></rect></clipPath>
		<clipPath id="scan-clip"><rect x="0" y="0" width="54" height="54"/></clipPath>
		<path id="route" d="M600 138 C625 138 640 152 676 158"/>
	</defs>

