[package]
name = "mailslot-ipc"
description = "Local JSON-RPC 2.0 API over a Unix socket for the Mailslot engine, plus the headless mailslotd daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["file-transfer", "json-rpc", "ipc", "daemon", "upload"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "mailslot_ipc"
path = "src/lib.rs"

[[bin]]
name = "mailslotd"
path = "src/bin/mailslotd.rs"

[dependencies]
mailslot-core = { workspace = true, features = ["server", "client", "portmap", "tls", "watch", "discovery"] }
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tokio = { workspace = true, features = ["net"] }
