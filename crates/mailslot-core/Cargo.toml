[package]
name = "mailslot-core"
description = "Engine, protocol, server, client and UPnP port mapping for Mailslot, a private file-drop slot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["file-transfer", "upload", "upnp", "server", "client"]
categories = ["network-programming", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["server", "client", "portmap", "tls"]
server = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tower", "dep:rustix"]
client = ["dep:reqwest"]
portmap = ["dep:igd-next", "dep:crab_nat", "dep:netdev"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rcgen", "reqwest?/rustls-no-provider"]

[dependencies]
base64.workspace = true
bytes.workspace = true
directories.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
local-ip-address.workspace = true
percent-encoding.workspace = true
url = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
rustix = { version = "1", features = ["fs"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"], optional = true }
igd-next = { version = "0.18", features = ["aio_tokio"], optional = true }
crab_nat = { version = "0.8", optional = true }
netdev = { version = "0.47", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["process"] }

[[example]]
name = "serve"
required-features = ["server"]

[[example]]
name = "embed"
required-features = ["server", "client"]
